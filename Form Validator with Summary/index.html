<!DOCTYPE html>
<html>
<head>
  <title>My Page</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <form id="registerForm" action="#">
    <label for="nameInput">Name: <span style="color: red">*</span></label>
    <input type="text" id="nameInput" name="name" placeholder="Enter Your Name..." required/>
    <p></p>

    <label for="emailInput">Email: <span style="color: red">*</span></label>
    <input type="email" id="emailInput" name="email" placeholder="Enter Your Email..." required/>
    <p></p>

    <label for="passwordInput">Password: <span style="color: red">*</span> </label>
    <input type="password" id="passwordInput" name="password" placeholder="Enter Your Password... " required>
    <p></p>

    <label for="confirmPasswordInput">ConfirmPassword: <span style="color: red">*</span> </label>
    <input type="password" id="confirmPasswordInput" name="confirmPassword" placeholder="Enter Your Password..." required>
    <p></p>

    <button type="submit" id="submit">Submit</button>
  </form>

  <div id="summarySection"></div>
  <script src="script.js"></script>
</body>
</html>
